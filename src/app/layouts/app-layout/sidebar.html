<!-- Menu par rôle : sprint 2 (LLD §2). -->
<nav
    class="sidebar fixed bottom-0 top-0 z-50 h-full min-h-screen w-[260px] shadow-[5px_0_25px_0_rgba(14,26,20,0.08)] transition-all duration-300"
    [attr.aria-label]="'layout.menu_principal' | translate"
>
    <div class="h-full bg-white dark:bg-night">
        <div class="flex items-center justify-between px-4 py-3">
            <a routerLink="/" class="main-logo flex shrink-0 items-center">
                <img class="ml-[5px] w-8 flex-none" src="/images/logo.svg" alt="" />
                <span class="align-middle text-2xl font-semibold dark:text-white-light lg:inline ltr:ml-1.5 rtl:mr-1.5">DAARA</span>
            </a>
            <button
                type="button"
                class="collapse-icon flex h-8 w-8 items-center rounded-full transition duration-300 hover:bg-gray-500/10 hover:text-primary dark:text-white-light dark:hover:bg-dark-light/10 rtl:rotate-180"
                [attr.aria-label]="'layout.replier_menu' | translate"
                (click)="layout.toggleSidebar()"
            >
                <icon-carets-down class="m-auto rotate-90" />
            </button>
        </div>

        <div class="sidebar-scroll relative h-[calc(100vh-80px)] overflow-y-auto overflow-x-hidden">
            <ul class="relative space-y-0.5 p-4 py-0 font-semibold">
                <li class="nav-item">
                    <a
                        routerLink="/"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="group"
                        (click)="layout.closeSidebarOnMobile()"
                    >
                        <div class="flex items-center">
                            <icon-menu-dashboard class="shrink-0 group-hover:!text-primary" />
                            <span class="text-black dark:text-night-muted dark:group-hover:text-white-dark ltr:pl-3 rtl:pr-3">{{
                                'menu.tableau_de_bord' | translate
                            }}</span>
                        </div>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
