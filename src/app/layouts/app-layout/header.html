<div class="relative flex w-full items-center bg-white px-5 py-2.5 dark:bg-night">
    <div class="horizontal-logo flex items-center justify-between ltr:mr-2 rtl:ml-2 lg:hidden">
        <a routerLink="/" class="main-logo flex shrink-0 items-center">
            <img class="inline w-8 ltr:-ml-1 rtl:-mr-1" src="/images/logo.svg" alt="" />
            <span class="hidden align-middle text-2xl font-semibold transition-all duration-300 ltr:ml-1.5 rtl:mr-1.5 dark:text-white-light md:inline">
                DAARA
            </span>
        </a>

        <button
            type="button"
            class="icon-btn collapse-icon flex-none ltr:ml-2 rtl:mr-2 dark:text-white-light lg:hidden"
            [attr.aria-label]="'layout.afficher_menu' | translate"
            (click)="layout.toggleSidebar()"
        >
            <icon-menu class="h-5 w-5" />
        </button>
    </div>

    <div class="flex items-center space-x-1.5 ltr:ml-auto rtl:mr-auto rtl:space-x-reverse dark:text-white-light lg:space-x-2">
        <!-- Libellé écrit dans la langue proposée (attribut lang), pratique d'accessibilité courante. -->
        <button
            type="button"
            class="icon-btn min-w-9 text-xs font-bold"
            [attr.aria-label]="'layout.langue.changer' | translate"
            [attr.title]="'layout.langue.changer' | translate"
            [attr.lang]="language.autreLangue()"
            (click)="language.basculer()"
        >
            {{ 'layout.langue.autre_code' | translate }}
        </button>

        <button
            type="button"
            class="icon-btn"
            [attr.aria-label]="'layout.theme.' + theme.mode() | translate"
            [attr.title]="'layout.theme.' + theme.mode() | translate"
            (click)="theme.cycleMode()"
        >
            @switch (theme.mode()) {
                @case ('light') {
                    <icon-sun />
                }
                @case ('dark') {
                    <icon-moon />
                }
                @default {
                    <icon-laptop />
                }
            }
        </button>
    </div>
</div>
