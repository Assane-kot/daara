<div class="relative flex w-full items-center bg-white px-5 py-2.5 dark:bg-night">
    <div class="horizontal-logo flex items-center justify-between lg:hidden ltr:mr-2 rtl:ml-2">
        <a routerLink="/" class="main-logo flex shrink-0 items-center">
            <img class="inline w-8 ltr:-ml-1 rtl:-mr-1" src="/images/logo.svg" alt="" />
            <span class="hidden align-middle text-2xl font-semibold transition-all duration-300 md:inline ltr:ml-1.5 rtl:mr-1.5 dark:text-white-light">
                DAARA
            </span>
        </a>

        <button
            type="button"
            class="icon-btn collapse-icon flex-none lg:hidden ltr:ml-2 rtl:mr-2 dark:text-white-light"
            [attr.aria-label]="'layout.afficher_menu' | translate"
            (click)="layout.toggleSidebar()"
        >
            <icon-menu class="h-5 w-5" />
        </button>
    </div>

    <div class="flex items-center space-x-1.5 lg:space-x-2 ltr:ml-auto rtl:mr-auto rtl:space-x-reverse dark:text-white-light">
        <!-- Libellé écrit dans la langue proposée (attribut lang), pratique d'accessibilité courante. -->
        <button
            type="button"
            class="icon-btn min-w-9 text-xs font-bold"
            [attr.aria-label]="'layout.langue.changer' | translate"
            [attr.title]="'layout.langue.changer' | translate"
            [attr.lang]="language.autreLangue()"
            (click)="language.basculer()"
        >
            {{ 'layout.langue.autre_code' | translate }}
        </button>

        <button
            type="button"
            class="icon-btn"
            [attr.aria-label]="'layout.theme.' + theme.mode() | translate"
            [attr.title]="'layout.theme.' + theme.mode() | translate"
            (click)="theme.cycleMode()"
        >
            @switch (theme.mode()) {
                @case ('light') {
                    <icon-sun />
                }
                @case ('dark') {
                    <icon-moon />
                }
                @default {
                    <icon-laptop />
                }
            }
        </button>

        <!-- Menu du compte (CDK Menu : clavier, Échap, focus restauré). -->
        <button
            type="button"
            class="icon-btn h-9 w-9 rounded-full bg-primary/10 font-extrabold text-primary uppercase"
            [cdkMenuTriggerFor]="menuCompte"
            [attr.aria-label]="'layout.compte.menu' | translate"
            [attr.title]="'layout.compte.menu' | translate"
        >
            {{ initiale() }}
        </button>
        <ng-template #menuCompte>
            <div cdkMenu class="mt-2 min-w-[220px] rounded-lg border border-white-light bg-white p-1.5 shadow-lg dark:border-night-border dark:bg-night-raised">
                <p class="truncate px-3 py-2 text-xs text-muted dark:text-night-muted">{{ identifiant() }}</p>
                @if (courante.slug(); as slug) {
                    <a
                        cdkMenuItem
                        class="flex min-h-11 w-full items-center gap-2 rounded-md px-3 text-left font-semibold hover:bg-primary/10 hover:text-primary focus:bg-primary/10"
                        [routerLink]="['/d', slug, 'compte']"
                    >
                        <icon-user class="h-[18px] w-[18px]" />
                        {{ 'layout.compte.mon_compte' | translate }}
                    </a>
                }
                <button
                    cdkMenuItem
                    type="button"
                    class="flex min-h-11 w-full items-center gap-2 rounded-md px-3 text-left font-semibold hover:bg-primary/10 hover:text-primary focus:bg-primary/10"
                    (cdkMenuItemTriggered)="deconnecter()"
                >
                    <icon-logout class="h-[18px] w-[18px]" />
                    {{ 'layout.compte.deconnexion' | translate }}
                </button>
            </div>
        </ng-template>
    </div>
</div>
