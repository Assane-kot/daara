# CI DAARA (HLD §9, LLD §10) : chaque push sur develop / main et chaque pull request.
# Aucun secret requis : le build et les tests utilisent le Supabase local (scripts/set-env.mjs).
name: CI

on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '24'

jobs:
    front:
        name: Front (format, lint, tests, build, audit)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Installation des dépendances
              run: npm ci

            - name: Format (Prettier)
              run: npm run format:check

            - name: Lint (ESLint)
              run: npm run lint

            - name: Tests unitaires (Vitest)
              run: npm run test:ci

            - name: Build de production
              run: npm run build

            - name: Audit des dépendances (vulnérabilités hautes et critiques)
              run: npm audit --audit-level=high

    edge:
        name: Edge Functions (lint, types, tests Deno)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Deno dans son conteneur officiel épinglé par empreinte (scripts/edge-test.mjs) : aucune dépendance npm.
            - name: Lint, types et tests (Deno 2.5.6)
              run: node scripts/edge-test.mjs

    base:
        name: Base (migrations + tests pgTAP)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Installation des dépendances (CLI Supabase)
              run: npm ci

            - name: Démarrage de Postgres et application des migrations
              run: npx supabase db start

            - name: Tests pgTAP (RLS, isolation inter-daara)
              run: npx supabase test db

            - name: Arrêt de Postgres
              if: always()
              run: npx supabase stop --no-backup

    secrets:
        name: Scan de secrets (gitleaks)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Tout l'historique est analysé, avec les règles de .gitleaks.toml (dont les clés sb_secret_).
            - name: gitleaks
              run: >
                  docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f -c
                  'git config --global --add safe.directory /repo && gitleaks git /repo --config /repo/.gitleaks.toml --redact --verbose'
