# Maintien en activité des projets Supabase Free (pause après 7 jours sans activité, ADR-003), utile en
# particulier pendant les vacances scolaires. Connexion avec le rôle `keepalive`, qui n'a AUCUN droit sur les
# données (docs/deploiement.md §4.5) : seule une requête `select 1` est exécutée.
name: Anti-pause Supabase

on:
    schedule:
        - cron: '0 6 */2 * *' # tous les deux jours, 06:00 UTC
    workflow_dispatch:

permissions:
    contents: read

jobs:
    maintien:
        name: Activité ${{ matrix.projet }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        strategy:
            fail-fast: false
            matrix:
                include:
                    - projet: daara-dev
                      secret: SUPABASE_DEV_KEEPALIVE_URL
                    - projet: daara-prod
                      secret: SUPABASE_PROD_KEEPALIVE_URL
        steps:
            - name: Requête select 1
              env:
                  DB_URL: ${{ secrets[matrix.secret] }}
              run: |
                  [ -n "$DB_URL" ] || { echo "::error::Secret ${{ matrix.secret }} manquant (voir docs/deploiement.md §4.5)"; exit 1; }
                  psql "$DB_URL" -tAc 'select 1' > /dev/null
                  echo "${{ matrix.projet }} actif"
